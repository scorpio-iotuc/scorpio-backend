services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # No published ports: only reachable from the api over the internal network.
    # For local debugging use: docker compose exec db psql -U postgres -d postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ./db_data:/var/lib/postgresql/data
    networks:
      - scorpio-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Only bound to localhost for debugging; public traffic arrives through the frontend nginx on scorpio-net
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - scorpio-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  scorpio-net:
    name: scorpio-net
